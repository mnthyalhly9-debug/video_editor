name: Build Video Editor APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Patch and Build APK
        run: |
          cd example
          flutter pub get

          python3 -c '
          import os, re

          # 1. ضبط إعدادات أندرويد
          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_gradle):
              with open(app_gradle, "r", encoding="utf-8") as f:
                  c = f.read()
              c = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 24", c)
              c = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", c)
              with open(app_gradle, "w", encoding="utf-8") as f:
                  f.write(c)

          # 2. توجيه Gradle لتحميل نسخة 5.1.LTS الرسمية
          root_gradle = "android/build.gradle"
          if os.path.exists(root_gradle):
              with open(root_gradle, "r", encoding="utf-8") as f:
                  rg = f.read()
              patch_str = """
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "com.arthenica" && details.requested.version == "5.1") {
                          details.useVersion "5.1.LTS"
                      }
                  }
              }
          }
          """
              if "resolutionStrategy" not in rg:
                  with open(root_gradle, "a", encoding="utf-8") as f:
                      f.write(patch_str)

          # 3. تعديل ملفات المكتبات في الذاكرة المؤقتة
          pub_cache = os.path.expanduser("~/.pub-cache")
          for root, dirs, files in os.walk(pub_cache):
              if "build.gradle" in files:
                  path = os.path.join(root, "build.gradle")
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  modified = False
                  if "5.1" in content and "5.1.LTS" not in content:
                      content = content.replace("ffmpeg-kit-min:5.1", "ffmpeg-kit-min:5.1.LTS")
                      content = content.replace("\x275.1\x27", "\x275.1.LTS\x27")
                      content = content.replace("\"5.1\"", "\"5.1.LTS\"")
                      modified = True
                  if "android {" in content and "namespace" not in content:
                      pkg = "xyz.justsoft.video_thumbnail"
                      mfile = os.path.join(root, "src", "main", "AndroidManifest.xml")
                      if os.path.exists(mfile):
                          with open(mfile, "r", encoding="utf-8") as mf:
                              m = re.search(r"package=[\"\x27]([^\s\"\x27]+)[\"\x27]", mf.read())
                              if m:
                                  pkg = m.group(1)
                      content = content.replace("android {", f"android {{\n    namespace \"{pkg}\"")
                      modified = True
                  if modified:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
          '
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-editor-apk
          path: example/build/app/outputs/flutter-apk/*.apk
