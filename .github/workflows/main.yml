name: Build Video Editor APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Patch dependencies and Build APK
        run: |
          cd example
          flutter pub get

          python3 -c '
          import os, re

          # 1. ضبط الحد الأدنى لإصدار أندرويد
          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_gradle):
              with open(app_gradle, "r", encoding="utf-8") as f:
                  c = f.read()
              c = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 24", c)
              c = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", c)
              with open(app_gradle, "w", encoding="utf-8") as f:
                  f.write(c)

          # 2. إضافة مستودعات بديلة إضافية
          root_gradle = "android/build.gradle"
          if os.path.exists(root_gradle):
              with open(root_gradle, "r", encoding="utf-8") as f:
                  rg = f.read()
              if "artifactory.appodeal.com" not in rg:
                  repo_snippet = """
                  allprojects {
                      repositories {
                          maven { url "https://artifactory.appodeal.com/appodeal-public" }
                          maven { url "https://jitpack.io" }
                      }
                  }
                  """
                  with open(root_gradle, "a", encoding="utf-8") as f:
                      f.write(repo_snippet)

          # 3. استبدال الحزمة المحذوفة بالحزمة النشطة وإصلاح الـ namespace
          pub_cache = os.path.expanduser("~/.pub-cache")
          for root, dirs, files in os.walk(pub_cache):
              if "build.gradle" in files:
                  path = os.path.join(root, "build.gradle")
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  orig = content
                  
                  # استبدال الرابط المحذوف بالنسخة البديلة المتوفرة رسمياً
                  content = re.sub(r"com\.arthenica:ffmpeg-kit-([a-zA-Z0-9_-]+):[^\s\x27\"]+", r"dev.ffmpegkit-maintained:ffmpeg-kit-\1:8.1.7", content)

                  # ضبط مساحة الأسماء للأندرويد
                  if "android {" in content and "namespace" not in content:
                      pkg = "com.plugin.fixed"
                      mfile = os.path.join(root, "src", "main", "AndroidManifest.xml")
                      if os.path.exists(mfile):
                          with open(mfile, "r", encoding="utf-8") as mf:
                              m = re.search(r"package=[\"\x27]([^\s\"\x27]+)[\"\x27]", mf.read())
                              if m:
                                  pkg = m.group(1)
                      content = content.replace("android {", f"android {{\n    namespace \"{pkg}\"")

                  if content != orig:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
          '
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-editor-apk
          path: example/build/app/outputs/flutter-apk/*.apk
