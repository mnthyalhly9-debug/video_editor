name: Build Video Editor APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Patch Video Editor Code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("example/lib/main.dart")

          if not file.exists():
              raise SystemExit("ERROR: lib/main.dart not found")

          code = file.read_text(encoding="utf-8")

          old = "config.getFFmpegProgress(stats.getTime())"
          new = "config.getFFmpegProgress(stats.getTime().toInt())"

          if old in code:
              code = code.replace(old, new)
              file.write_text(code, encoding="utf-8")
              print("Fixed double/int type mismatch.")
          elif new in code:
              print("Type mismatch fix already applied.")
          else:
              raise SystemExit(
                  "ERROR: Expected FFmpeg progress code not found."
              )
          PY

      - name: Update dependencies and Patch Android
        run: |
          cd example

          flutter pub get

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle = Path("android/app/build.gradle")

          if gradle.exists():
              content = gradle.read_text(encoding="utf-8")

              content = re.sub(
                  r"minSdkVersion\s+flutter\.minSdkVersion",
                  "minSdkVersion 24",
                  content
              )

              content = re.sub(
                  r"minSdkVersion\s+\d+",
                  "minSdkVersion 24",
                  content
              )

              gradle.write_text(content, encoding="utf-8")

          pub_cache = os.path.expanduser("~/.pub-cache")

          for root, dirs, files in os.walk(pub_cache):
              if "build.gradle" not in files:
                  continue

              path = os.path.join(root, "build.gradle")

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()

                  if "android {" not in content:
                      continue

                  if re.search(r"^\s*namespace\s+", content, re.M):
                      continue

                  manifest = os.path.join(
                      root, "src", "main", "AndroidManifest.xml"
                  )

                  if not os.path.exists(manifest):
                      continue

                  with open(manifest, "r", encoding="utf-8") as f:
                      xml = f.read()

                  match = re.search(
                      r'package=["\']([^"\']+)["\']', xml
                  )

                  if not match:
                      continue

                  namespace = match.group(1)

                  content = content.replace(
                      "android {",
                      'android {\n    namespace "' + namespace + '"',
                      1
                  )

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  print("Added namespace:", namespace)

              except (OSError, UnicodeError) as error:
                  print("Skipped:", path, error)
          PY

          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-editor-apk
          path: example/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
